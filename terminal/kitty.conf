# Future Crash + LOOK — shared Kitty profile for macOS and Linux.
# Personal overrides: ~/.config/kitty/kitty-local.conf (loaded last).
# Use the login shell selected by the OS; do not pin /bin/zsh across machines.
font_family MesloLGS NF
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0

window_padding_width 6
remember_window_size yes
initial_window_width 120c
initial_window_height 36c
background_opacity 1.0
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
scrollback_lines 20000
copy_on_select no
enable_audio_bell no
visual_bell_duration 0.0
confirm_os_window_close -1

# Green phosphor, with distinct ANSI colors for diagnostics and cover art.
background #071009
foreground #d4e5d8
cursor #8fd6a2
cursor_text_color #071009
selection_background #31543a
selection_foreground #ffffff
url_color #8fd6a2
color0 #101a14
color1 #dc7777
color2 #8fd6a2
color3 #d9bf80
color4 #83a9d9
color5 #b69acb
color6 #80c9c4
color7 #c4d5c8
color8 #617268
color9 #f29b9b
color10 #b5ebc2
color11 #f1dba5
color12 #a6c8ee
color13 #d2b5e5
color14 #a5e5df
color15 #f0f6f1

tab_bar_edge top
tab_bar_style separator
tab_bar_min_tabs 2
active_tab_foreground #071009
active_tab_background #8fd6a2
inactive_tab_foreground #91c79e
inactive_tab_background #14271a

# Both Option keys act as Alt for LOOK/LO/Neovim and firmware navigation layers.
macos_option_as_alt both
macos_titlebar_color background

# Own only these terminal shortcuts. App arrows, Shift-arrows and Ctrl-R pass
# through; Kitty's default Shift-Up/Down scrollback bindings would steal LOOK keys.
clear_all_shortcuts yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t launch --type=tab --cwd=current
map ctrl+shift+n launch --type=os-window --cwd=current
map ctrl+shift+w close_window
map ctrl+shift+tab previous_tab
map ctrl+tab next_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+f5 load_config_file
map ctrl+shift+u kitten hints

# Conventional Mac shortcuts coexist with the shared Control-Shift bindings.
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+t launch --type=tab --cwd=current
map cmd+n launch --type=os-window --cwd=current
map cmd+w close_window
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0

globinclude kitty-local.conf
